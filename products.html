<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Products</title>
    <link rel="stylesheet" href="style.css">
</head>
    

<body>

<header class="site-header">
    <a class="logo" href="index.html">ShopEase</a>

    <nav>
        <a href="index.html">Home</a>
        <a class="active" href="products.html">Products</a>
        <a href="cart.html">
            Cart <span class="cart-count">0</span>
        </a>
    </nav>
</header>

<main class="page-wrap">

    <div class="page-title">
        <span class="eyebrow">THE SHOP</span>
        <h1>Find something good.</h1>
        <p>Browse our collection of everyday favourites.</p>
    </div>

    <!-- Product Search and Filter Section -->
    <div class="shop-toolbar">

        <input
            id="search-input"
            type="search"
            placeholder="Search products..."
            aria-label="Search products"
        >

        <select id="category-filter" aria-label="Filter by category">
            <option value="All">All categories</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Home</option>
            <option>Accessories</option>
        </select>

        <select id="sort-filter" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="name">Name: A to Z</option>
        </select>

        <!-- New Clear Filters Button -->
        <button
            type="button"
            id="clear-filters"
            class="btn btn-dark"
        >
            Clear Filters
        </button>

    </div>

    <p id="result-count" class="result-count"></p>

    <div id="all-products" class="product-grid"></div>

</main>

<footer>
    <a class="logo" href="index.html">ShopEase</a>
    <p>Thoughtful finds for everyday life.</p>
    <small>© 2026 ShopEase. Demo shopping website.</small>
</footer>

<script src="script.js"></script>

</body>
</html>
